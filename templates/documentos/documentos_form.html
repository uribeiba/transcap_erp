{% extends "layout/base.html" %}

{% block title %}
Crear Documento
{% endblock %}

{% block content %}

<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>Registrar Documento</h1>
            </div>
            <div class="col-sm-6 text-right">
                <a href="{% url 'documentos:lista' %}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i>
                    Volver
                </a>
            </div>
        </div>
    </div>
</section>

<section class="content">

<div class="card card-primary">

<div class="card-header">
    <h3 class="card-title">
        Nuevo Registro Manual
    </h3>
</div>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="card-body">

<div class="row">

<div class="col-md-4">

<div class="form-group">
<label>
Usuario / Conductor
</label>

<select name="usuario" class="form-control" required>

<option value="">
Seleccione usuario
</option>

{% for u in usuarios %}

<option value="{{ u.id }}">
{{ u.username }}
</option>

{% endfor %}

</select>

</div>

</div>

<div class="col-md-4">

<div class="form-group">
<label>
Tipo de Documento
</label>

<select name="tipo" class="form-control" required>

<option value="">
Seleccione tipo
</option>

<option value="GUIA">
Guía
</option>

<option value="PEAJE">
Peaje
</option>

<option value="CARGA">
Foto de Carga
</option>

</select>

</div>

</div>

<div class="col-md-4">

<div class="form-group">
<label>
Número de Documento (opcional)
</label>

<input
    type="text"
    name="numero_documento"
    class="form-control"
    placeholder="Ej: 123456"
>

</div>

</div>

</div>

<div class="row">

<div class="col-md-6">

<div class="form-group">
<label>
Subir Imagen
</label>

<input
    type="file"
    name="imagen"
    class="form-control"
    accept="image/*"
    required
>

<small class="text-muted">
Puede ser guía, peaje o fotografía de carga
</small>

</div>

</div>

<div class="col-md-6">

<div class="form-group">
<label>
Vista previa
</label>

<br>

<img
    id="preview"
    src="#"
    style="max-width:100%; height:200px; display:none;"
    class="img-thumbnail"
>

</div>

</div>

</div>

</div>

<div class="card-footer">

<button type="submit" class="btn btn-primary">

<i class="fas fa-save"></i>

Guardar Documento

</button>

<a href="{% url 'documentos:lista' %}" class="btn btn-default">
Cancelar
</a>

</div>

</form>

</div>

</section>

<script>

// Vista previa de imagen

document.addEventListener("DOMContentLoaded", function () {

    const input = document.querySelector('input[name="imagen"]');

    const preview = document.getElementById("preview");

    input.addEventListener("change", function () {

        const file = this.files[0];

        if (file) {

            const reader = new FileReader();

            reader.onload = function (e) {

                preview.src = e.target.result;

                preview.style.display = "block";

            };

            reader.readAsDataURL(file);

        }

    });

});

</script>

{% endblock %}
